name = "researchpublication"
main = "worker.js"
compatibility_date = "2026-07-31"

[assets]
directory = "./"
binding = "ASSETS"

# The spreadsheet ID from your Google Sheet's URL, e.g.
# https://docs.google.com/spreadsheets/d/THIS_PART_IS_THE_ID/edit
[vars]
GOOGLE_SHEET_ID = "REPLACE_WITH_YOUR_GOOGLE_SHEET_ID"

# Set these as SECRETS (not here) in the Cloudflare dashboard:
# Settings -> Variables and Secrets -> Add:
#   ADMIN_PASSWORD                - your admin password
#   GOOGLE_SERVICE_ACCOUNT_EMAIL  - the service account's "client_email"
#   GOOGLE_PRIVATE_KEY            - the service account's "private_key" (paste as-is, keep the \n)
